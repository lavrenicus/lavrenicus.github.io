<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" role="img">
  <title>Потолочная вент-панель коридора (бесшовная)</title>
  <defs>
    <!--
      Seamless uniform vent panel. The 128x64 cell divides 512 exactly (4x8).
      Two symmetric slots (x 8..56 and 72..120): the inter-cell gap at the
      cell boundary is 16px, same as the inner gap => no irregular spacing.
      Filled rects only inside the cell; no gradients, filters or stray decor.
    -->
    <pattern id="ventCell" width="128" height="64" patternUnits="userSpaceOnUse">
      <rect x="8" y="10" width="48" height="44" rx="4" fill="#171a21"/>
      <rect x="72" y="10" width="48" height="44" rx="4" fill="#171a21"/>
      <rect x="12" y="18" width="40" height="4" fill="#2a2f39"/>
      <rect x="12" y="30" width="40" height="4" fill="#2a2f39"/>
      <rect x="12" y="42" width="40" height="4" fill="#2a2f39"/>
      <rect x="76" y="18" width="40" height="4" fill="#2a2f39"/>
      <rect x="76" y="30" width="40" height="4" fill="#2a2f39"/>
      <rect x="76" y="42" width="40" height="4" fill="#2a2f39"/>
    </pattern>
  </defs>
  <rect width="512" height="512" fill="#22262e"/>
  <rect width="512" height="512" fill="url(#ventCell)"/>
</svg>
