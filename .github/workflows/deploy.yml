name: Deploy to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5

  # Post-deploy guard: the site must serve the Next.js export, not a
  # Jekyll/README build. Catches an accidental switch of
  # Settings -> Pages -> Source back to "Deploy from a branch",
  # where Actions reports success but publishes nothing.
  verify:
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - name: Verify live site serves the Next.js export
        run: |
          set -uo pipefail
          url="https://lavrenicus.github.io/"
          for i in 1 2 3 4 5 6; do
            body="$(curl -fsSL --max-time 30 "$url" 2>/dev/null || true)"
            if [ -n "$body" ] \
              && printf '%s' "$body" | grep -q '/_next/' \
              && ! printf '%s' "$body" | grep -q 'markdown-body'; then
              echo "OK (attempt $i): live site serves the Next.js export"
              exit 0
            fi
            echo "attempt $i/6: live site is not the Next.js export yet (or unreachable), retrying in 20s"
            sleep 20
          done
          echo "FAILED: $url is not serving the Next.js export."
          echo "Most likely Settings -> Pages -> Source was switched back to 'Deploy from a branch'"
          echo "(Jekyll builds README.md into the index when the repo root has no index.html)."
          exit 1
